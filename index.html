<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodday Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; background-color: #F3F4F6; }
    .form-input {
      width: 100%; border: 1px solid #D1D5DB; border-radius: 0.5rem; padding: 0.65rem;
      font-size: 1rem; background-color: white; color: #374151; font-family: 'Sarabun';
    }
    .page-view { display: none !important; }
    .page-view.active { display: block !important; }
    .page-view.active.flex { display: flex !important; }
  </style>
</head>
<body class="antialiased text-gray-800">
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[10000] w-11/12 max-w-md flex flex-col gap-2"></div>
  <div id="loading-overlay" class="fixed inset-0 bg-black/50 z-[9999] hidden flex-col items-center justify-center">
    <div class="w-14 h-14 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
    <p class="text-white font-bold text-lg mt-4" id="loading-text">กำลังประมวลผล...</p>
  </div>

  <!-- หน้า Login -->
  <div id="login-view" class="page-view active min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-md p-8 w-full max-w-sm text-center">
    <div class="w-16 h-16 bg-gray-800 text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
      <i class="fa-solid fa-user-shield"></i>
    </div>
    <h2 class="text-xl font-black text-gray-800 mb-4">Goodday Admin</h2>
    <input id="admin-memberid-input" type="text" class="form-input mb-3" placeholder="รหัสสมาชิก (เช่น GD-123456)">
    <input id="admin-password-input" type="password" class="form-input mb-3" placeholder="รหัสผ่าน">
    <div id="login-error" class="text-red-500 text-sm font-bold mb-3 hidden"></div>
    <button id="btn-admin-login" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold">เข้าสู่ระบบ</button>
  </div>
</div>

  <!-- โครงหลัก (แถบเมนูซ้าย + เนื้อหา) -->
  <div id="dashboard-view" class="page-view min-h-screen flex">
    <div class="w-56 bg-gray-800 text-white min-h-screen p-4 shrink-0">
      <h2 class="text-lg font-black mb-6"><i class="fa-solid fa-gauge mr-2"></i>Goodday Admin</h2>
      <button data-module="foods" class="module-tab w-full text-left px-3 py-2.5 rounded-lg mb-1 font-bold text-sm">
        <i class="fa-solid fa-bowl-food mr-2"></i>เมนูอาหาร
      </button>
      <button data-module="events" class="module-tab w-full text-left px-3 py-2.5 rounded-lg mb-1 font-bold text-sm">
        <i class="fa-solid fa-calendar-days mr-2"></i>กิจกรรม
      </button>
      <button data-module="orginfo" class="module-tab w-full text-left px-3 py-2.5 rounded-lg mb-1 font-bold text-sm">
        <i class="fa-solid fa-building mr-2"></i>รู้จักเรา
      </button>
      <button data-module="faqs" class="module-tab w-full text-left px-3 py-2.5 rounded-lg mb-1 font-bold text-sm">
        <i class="fa-solid fa-circle-question mr-2"></i>คำถามที่พบบ่อย
      </button>
      <button data-module="shops" class="module-tab w-full text-left px-3 py-2.5 rounded-lg mb-1 font-bold text-sm">
        <i class="fa-solid fa-shop mr-2"></i>ร้านค้า
      </button>
      <button data-module="products" class="module-tab w-full text-left px-3 py-2.5 rounded-lg mb-1 font-bold text-sm">
        <i class="fa-solid fa-box-open mr-2"></i>สินค้า
      </button>
    </div>

    <div class="flex-1 p-6 overflow-y-auto">
      <!-- โมดูล: เมนูอาหาร -->
      <div id="module-foods" class="module-content hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-black text-gray-800">จัดการเมนูอาหาร</h2>
          <button id="btn-new-food" class="bg-emerald-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-plus mr-1"></i>เพิ่มเมนูใหม่</button>
        </div>
        <div id="foods-list" class="grid grid-cols-3 gap-4"></div>
      </div>

      <!-- โมดูล: กิจกรรม -->
      <div id="module-events" class="module-content hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-black text-gray-800">จัดการกิจกรรม</h2>
          <button id="btn-new-event" class="bg-pink-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-plus mr-1"></i>เพิ่มกิจกรรมใหม่</button>
        </div>
        <div id="events-list" class="grid grid-cols-2 gap-4"></div>
      </div>

      <!-- โมดูล: รู้จักเรา (orgInfo) -->
      <div id="module-orginfo" class="module-content hidden">
        <h2 class="text-2xl font-black text-gray-800 mb-4">จัดการข้อมูล "รู้จักเรา"</h2>
        <div class="bg-white rounded-xl shadow-sm border p-6 max-w-2xl">
          <label class="text-sm font-bold text-gray-500 block mb-1">ชื่อองค์กร</label>
          <input id="org-name" class="form-input mb-3" placeholder="Goodday">

          <label class="text-sm font-bold text-gray-500 block mb-1">คำอธิบายองค์กร</label>
          <textarea id="org-description" rows="3" class="form-input mb-3"></textarea>

          <label class="text-sm font-bold text-gray-500 block mb-1">ลิงก์โลโก้</label>
          <input id="org-logo" class="form-input mb-3" placeholder="https://...">

          <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
              <label class="text-sm font-bold text-gray-500 block mb-1">เบอร์โทรศัพท์</label>
              <input id="org-phone" class="form-input">
            </div>
            <div>
              <label class="text-sm font-bold text-gray-500 block mb-1">ผู้ประสานงาน</label>
              <input id="org-coordinator" class="form-input">
            </div>
          </div>

          <label class="text-sm font-bold text-gray-500 block mb-1">อีเมล</label>
          <input id="org-email" class="form-input mb-4" placeholder="contact@goodday.com">

          <h3 class="text-base font-black text-gray-700 mb-2 border-t pt-4">ช่องทางโซเชียล</h3>
          <div class="space-y-2 mb-4">
            <div class="flex items-center gap-2">
              <i class="fa-brands fa-instagram text-lg text-pink-500 w-6"></i>
              <input id="org-instagram" class="form-input" placeholder="ลิงก์ Instagram">
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-brands fa-facebook text-lg text-blue-600 w-6"></i>
              <input id="org-facebook" class="form-input" placeholder="ลิงก์ Facebook">
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-brands fa-tiktok text-lg text-gray-900 w-6"></i>
              <input id="org-tiktok" class="form-input" placeholder="ลิงก์ TikTok">
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-brands fa-youtube text-lg text-red-600 w-6"></i>
              <input id="org-youtube" class="form-input" placeholder="ลิงก์ YouTube">
            </div>
          </div>

          <button id="btn-save-orginfo" class="w-full bg-gray-800 text-white py-3 rounded-lg font-bold">บันทึกข้อมูล</button>
        </div>
      </div>

      <!-- โมดูล: คำถามที่พบบ่อย -->
      <div id="module-faqs" class="module-content hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-black text-gray-800">จัดการคำถามที่พบบ่อย</h2>
          <button id="btn-new-faq" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-plus mr-1"></i>เพิ่มคำถามใหม่</button>
        </div>
        <div id="faqs-list" class="space-y-3 max-w-2xl"></div>
      </div>
    </div>
  </div>

  <!-- ป็อปอัพแก้ไขเมนูอาหาร -->
  <div id="food-modal" class="fixed inset-0 bg-black/60 z-[9998] hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-black text-gray-800 mb-4">แก้ไขเมนูอาหาร</h3>
      <input type="hidden" id="food-id">
      <label class="text-sm font-bold text-gray-500 block mb-1">ชื่อเมนู</label>
      <input id="food-name" class="form-input mb-3" placeholder="ชื่อเมนู">
      <label class="text-sm font-bold text-gray-500 block mb-1">คำโปรย</label>
      <input id="food-concept" class="form-input mb-3" placeholder="คำโปรยสั้นๆ">
      <label class="text-sm font-bold text-gray-500 block mb-1">ลิงก์รูปภาพ</label>
      <input id="food-image" class="form-input mb-3" placeholder="https://...">
      <label class="text-sm font-bold text-gray-500 block mb-1">วัตถุดิบ (1 บรรทัด = 1 รายการ, ขึ้นต้นด้วย - = รายการย่อย)</label>
      <textarea id="food-ingredients" rows="4" class="form-input mb-3" placeholder="ผักสลัดรวม&#10;- กาดขาว 1 กำมือ"></textarea>
      <label class="text-sm font-bold text-gray-500 block mb-1">วิธีทำ (1 บรรทัด = 1 ขั้นตอน)</label>
      <textarea id="food-instructions" rows="4" class="form-input mb-3" placeholder="ล้างผักให้สะอาด&#10;หั่นผักเป็นชิ้น"></textarea>
      <label class="text-sm font-bold text-gray-500 block mb-1">เกร็ดความรู้ (รูปแบบ: อิโมจิ|หัวข้อ|รายละเอียด ต่อ 1 บรรทัด)</label>
      <textarea id="food-tips" rows="3" class="form-input mb-4" placeholder="🥗|โปรตีนสูง|เพิ่มไข่ต้มได้"></textarea>
      <div class="flex gap-2">
        <button id="btn-save-food" class="flex-1 bg-emerald-600 text-white py-3 rounded-lg font-bold">บันทึก</button>
        <button id="btn-delete-food" class="bg-red-50 text-red-600 px-4 py-3 rounded-lg font-bold">ลบ</button>
        <button id="btn-close-food-modal" class="bg-gray-100 text-gray-600 px-4 py-3 rounded-lg font-bold">ปิด</button>
      </div>
    </div>
  </div>

  <!-- ป็อปอัพแก้ไขกิจกรรม -->
  <div id="event-modal" class="fixed inset-0 bg-black/60 z-[9998] hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-black text-gray-800 mb-4">แก้ไขกิจกรรม</h3>
      <input type="hidden" id="event-id">
      <label class="text-sm font-bold text-gray-500 block mb-1">ชื่อกิจกรรม</label>
      <input id="event-name" class="form-input mb-3" placeholder="ชื่อกิจกรรม">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">หมวดหมู่</label>
          <input id="event-category" class="form-input" placeholder="health / workshop">
        </div>
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">จังหวัด</label>
          <input id="event-province" class="form-input" placeholder="ชลบุรี หรือ all">
        </div>
      </div>
      <label class="text-sm font-bold text-gray-500 block mb-1">ลิงก์รูปภาพ</label>
      <input id="event-image" class="form-input mb-3" placeholder="https://...">
      <label class="text-sm font-bold text-gray-500 block mb-1">คำอธิบาย</label>
      <textarea id="event-description" rows="2" class="form-input mb-3"></textarea>
      <label class="text-sm font-bold text-gray-500 block mb-1">สถานที่</label>
      <input id="event-location" class="form-input mb-3">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">อายุขั้นต่ำ (0=ไม่จำกัด)</label>
          <input id="event-minage" type="number" class="form-input" value="0">
        </div>
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">อายุขั้นสูง (0=ไม่จำกัด)</label>
          <input id="event-maxage" type="number" class="form-input" value="0">
        </div>
      </div>

      <label class="text-sm font-bold text-gray-500 block mb-2">รอบเวลา (Slots)</label>
      <div id="event-slots-container" class="space-y-2 mb-3"></div>
      <button id="btn-add-slot" class="w-full border-2 border-dashed border-gray-300 text-gray-500 py-2 rounded-lg font-bold text-sm mb-4">+ เพิ่มรอบเวลา</button>

      <div class="flex gap-2">
        <button id="btn-save-event" class="flex-1 bg-pink-600 text-white py-3 rounded-lg font-bold">บันทึก</button>
        <button id="btn-delete-event" class="bg-red-50 text-red-600 px-4 py-3 rounded-lg font-bold">ลบ</button>
        <button id="btn-close-event-modal" class="bg-gray-100 text-gray-600 px-4 py-3 rounded-lg font-bold">ปิด</button>
      </div>
    </div>
  </div>

  <!-- ป็อปอัพแก้ไข FAQ -->
  <div id="faq-modal" class="fixed inset-0 bg-black/60 z-[9998] hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg">
      <h3 class="text-lg font-black text-gray-800 mb-4">แก้ไขคำถามที่พบบ่อย</h3>
      <input type="hidden" id="faq-id">
      <label class="text-sm font-bold text-gray-500 block mb-1">คำถาม</label>
      <input id="faq-question" class="form-input mb-3" placeholder="คำถาม">
      <label class="text-sm font-bold text-gray-500 block mb-1">คำตอบ</label>
      <textarea id="faq-answer" rows="4" class="form-input mb-3" placeholder="คำตอบ"></textarea>
      <label class="text-sm font-bold text-gray-500 block mb-1">ลำดับการแสดงผล (ตัวเลขน้อย = อยู่บนสุด)</label>
      <input id="faq-order" type="number" class="form-input mb-4" placeholder="1">
      <div class="flex gap-2">
        <button id="btn-save-faq" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold">บันทึก</button>
        <button id="btn-delete-faq" class="bg-red-50 text-red-600 px-4 py-3 rounded-lg font-bold">ลบ</button>
        <button id="btn-close-faq-modal" class="bg-gray-100 text-gray-600 px-4 py-3 rounded-lg font-bold">ปิด</button>
      </div>
    </div>

  <!-- โมดูล: ร้านค้า -->
  <div id="module-shops" class="module-content hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-black text-gray-800">จัดการร้านค้า</h2>
      <button id="btn-new-shop" class="bg-pink-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-plus mr-1"></i>เพิ่มร้านใหม่</button>
    </div>
    <div id="shops-list" class="grid grid-cols-3 gap-4"></div>
  </div>

  <!-- โมดูล: สินค้า -->
  <div id="module-products" class="module-content hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-black text-gray-800">จัดการสินค้า</h2>
      <div class="flex gap-2">
        <select id="product-shop-filter" class="form-input" style="width: auto;">
          <option value="">ทุกร้านค้า</option>
        </select>
        <button id="btn-new-product" class="bg-purple-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm"><i class="fa-solid fa-plus mr-1"></i>เพิ่มสินค้าใหม่</button>
      </div>
    </div>
    <div id="products-list" class="grid grid-cols-3 gap-4"></div>
  </div>

  <!-- ป็อปอัพแก้ไขร้านค้า -->
  <div id="shop-modal" class="fixed inset-0 bg-black/60 z-[9998] hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-black text-gray-800 mb-4">แก้ไขร้านค้า</h3>
      <input type="hidden" id="shop-id">
      <label class="text-sm font-bold text-gray-500 block mb-1">ชื่อร้าน</label>
      <input id="shop-name" class="form-input mb-3">
      <label class="text-sm font-bold text-gray-500 block mb-1">คำอธิบายร้าน</label>
      <textarea id="shop-description" rows="2" class="form-input mb-3"></textarea>
      <label class="text-sm font-bold text-gray-500 block mb-1">รหัสสมาชิกเจ้าของร้าน (uid หรือ memberId)</label>
      <input id="shop-owner" class="form-input mb-3" placeholder="line_xxxxxxxxxx">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">PromptPay ID</label>
          <input id="shop-promptpay" class="form-input" placeholder="เบอร์โทร/เลขบัตร ปชช.">
        </div>
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">ธนาคาร</label>
          <input id="shop-bankname" class="form-input" placeholder="กสิกรไทย">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-4">
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">เลขบัญชี</label>
          <input id="shop-bankaccount" class="form-input">
        </div>
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">ชื่อบัญชี</label>
          <input id="shop-bankname-owner" class="form-input">
        </div>
      </div>
      <div class="flex gap-2">
        <button id="btn-save-shop" class="flex-1 bg-pink-600 text-white py-3 rounded-lg font-bold">บันทึก</button>
        <button id="btn-delete-shop" class="bg-red-50 text-red-600 px-4 py-3 rounded-lg font-bold">ลบ</button>
        <button id="btn-close-shop-modal" class="bg-gray-100 text-gray-600 px-4 py-3 rounded-lg font-bold">ปิด</button>
      </div>
    </div>
  </div>

  <!-- ป็อปอัพแก้ไขสินค้า -->
  <div id="product-modal" class="fixed inset-0 bg-black/60 z-[9998] hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-black text-gray-800 mb-4">แก้ไขสินค้า</h3>
      <input type="hidden" id="product-id">
      <label class="text-sm font-bold text-gray-500 block mb-1">ร้านค้าเจ้าของสินค้า</label>
      <select id="product-shop" class="form-input mb-3"></select>
      <label class="text-sm font-bold text-gray-500 block mb-1">ชื่อสินค้า</label>
      <input id="product-name" class="form-input mb-3">
      <label class="text-sm font-bold text-gray-500 block mb-1">คำอธิบายสินค้า</label>
      <textarea id="product-description" rows="2" class="form-input mb-3"></textarea>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">ราคา (บาท)</label>
          <input id="product-price" type="number" class="form-input">
        </div>
        <div>
          <label class="text-sm font-bold text-gray-500 block mb-1">สต็อก (ชิ้น)</label>
          <input id="product-stock" type="number" class="form-input">
        </div>
      </div>
      <label class="text-sm font-bold text-gray-500 block mb-1">ตัวเลือกสินค้า (ไม่บังคับ เช่น สี, ไซส์ — คั่นด้วย comma)</label>
      <input id="product-variants" class="form-input mb-3" placeholder="แดง, น้ำเงิน, เขียว">
      <label class="flex items-center gap-2 mb-4 cursor-pointer">
        <input type="checkbox" id="product-featured" class="w-5 h-5">
        <span class="text-sm font-bold text-gray-600">ตั้งเป็นสินค้าแนะนำ</span>
      </label>
      <div class="flex gap-2">
        <button id="btn-save-product" class="flex-1 bg-purple-600 text-white py-3 rounded-lg font-bold">บันทึก</button>
        <button id="btn-delete-product" class="bg-red-50 text-red-600 px-4 py-3 rounded-lg font-bold">ลบ</button>
        <button id="btn-close-product-modal" class="bg-gray-100 text-gray-600 px-4 py-3 rounded-lg font-bold">ปิด</button>
      </div>
    </div>
  </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
